<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7K Design & Printing Area</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --accent: #00FFFF;
            --bg-dark: #050505;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            scroll-behavior: smooth;
        }

        body { 
            background: radial-gradient(circle at center, #101820 0%, #050505 100%);
            color: #ffffff; line-height: 1.6; overflow-x: hidden;
        }

        /* --- Navigation --- */
        .nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 8%; background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            position: fixed; top: 0; width: 100%; z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo img { height: 40px; border-radius: 5px; }
        .logo span { font-size: 1.6rem; font-weight: 800; color: var(--accent); letter-spacing: 2px; }
        .menu a { color: #fff; text-decoration: none; margin-left: 20px; font-size: 0.85rem; font-weight: 500; transition: 0.3s; }
        .menu a:hover { color: var(--accent); text-shadow: 0 0 10px var(--accent); }

        /* Burger Menu */
        .burger { display: none; cursor: pointer; flex-direction: column; gap: 5px; z-index: 1001; }
        .burger div { width: 25px; height: 3px; background: var(--accent); transition: 0.3s; }

        /* --- Hero Section --- */
        .hero {
            height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('img/hero-bg.jpg') no-repeat center center/cover;
            padding: 100px 20px 0;
        }
        .hero-content h2 { 
            font-size: clamp(2.5rem, 9vw, 5rem); font-weight: 800;
            background: linear-gradient(to right, #ffffff 10%, var(--accent) 90%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(0, 255, 255, 0.3)); margin-bottom: 20px;
        }
        .hero-content .eng-motto { font-size: 1.2rem; color: #eee; letter-spacing: 2px; margin-bottom: 10px; }
