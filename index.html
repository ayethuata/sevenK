<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7K Design & Printing Area</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --accent: #00FFFF;
            --bg-dark: #050505;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            scroll-behavior: smooth;
        }

        body { 
            background: radial-gradient(circle at center, #101820 0%, #050505 100%);
            color: #ffffff; line-height: 1.6; overflow-x: hidden;
        }

        /* --- Navigation --- */
        .nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 8%; background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            position: fixed; top: 0; width: 100%; z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo img { height: 40px; border-radius: 5px; }
        .logo span { font-size: 1.6rem; font-weight: 800; color: var(--accent); letter-spacing: 2px; }
        .menu a { color: #fff; text-decoration: none; margin-left: 20px; font-size: 0.85rem; font-weight: 500; transition: 0.3s; }
        .menu a:hover { color: var(--accent); text-shadow: 0 0 10px var(--accent); }

        /* --- Hero Section --- */
        .hero {
            height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('img/hero-bg.jpg') no-repeat center center/cover;
            padding: 100px 20px 0;
        }
        .hero-content h2 { 
            font-size: clamp(2.5rem, 9vw, 5rem); font-weight: 800;
            background: linear-gradient(to right, #ffffff 10%, var(--accent) 90%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(0, 255, 255, 0.3)); margin-bottom: 20px;
        }
        .hero-content .eng-motto { font-size: 1.2rem; color: #eee; letter-spacing: 2px; margin-bottom: 10px; }
        .hero-content .mm-motto { font-size: 1.1rem; color: var(--accent); margin-bottom: 40px; }
        .btn-main { padding: 14px 45px; background: var(--accent); color: #000; text-decoration: none; border-radius: 50px; font-weight: 800; text-transform: uppercase; transition: 0.3s; display: inline-block; }
        .btn-main:hover { transform: scale(1.05); box-shadow: 0 0 30px var(--accent); }

        .section-title {
            font-size: 2.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 4px;
            margin: 80px 0 40px; text-align: center;
            background: linear-gradient(to bottom, #ffffff, var(--accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        /* --- Services Section --- */
        .services { padding: 80px 8%; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 30px; }
        .card { background: var(--glass); border-radius: 30px; border: 1px solid var(--border); transition: 0.4s; overflow: hidden; display: flex; flex-direction: column; }
        .card:hover { border-color: var(--accent); transform: translateY(-15px); box-shadow: 0 0 30px rgba(0, 255, 255, 0.1); }
        .card-img { width: 100%; height: 260px; overflow: hidden; }
        .card-img img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .card:hover .card-img img { transform: scale(1.1); }
        .card-info { padding: 35px; text-align: left; }
        .card-info h3 { color: var(--accent); font-size: 1.4rem; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .card-info ul { list-style: none; font-size: 0.85rem; color: #ddd; }
        .card-info ul li { margin-bottom: 8px; display: flex; align-items: flex-start; }
        .card-info ul li::before { content: "✔"; color: var(--accent); margin-right: 12px; }

        .print-sub-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .print-col h4 { color: #fff; font-size: 0.9rem; margin-bottom: 10px; border-left: 2px solid var(--accent); padding-left: 10px; }
        .custom-note { font-size: 0.75rem; color: var(--accent); font-style: italic; margin-top: 15px; }

        /* --- Gallery Section --- */
        .gallery { 
            padding: 80px 8%; 
            background: rgba(255, 255, 255, 0.02); 
        }
        .gallery-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); 
            gap: 25px; 
            margin-top: 40px;
        }
        .gallery-item { 
            height: 320px; 
            border-radius: 15px; 
            overflow: hidden; 
            border: 1px solid var(--border); 
            position: relative; 
            cursor: pointer;
            background: #111; 
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .gallery-item img { 
            max-width: 100%; 
            max-height: 100%; 
            width: auto; 
            height: auto; 
            object-fit: contain; 
            transition: transform 0.5s ease; 
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transform: scale(1); 
        }
        .gallery-item:hover img { 
            transform: scale(1.25); 
        }
        .gallery-overlay { 
            position: absolute; 
            bottom: 0; 
            width: 100%; 
            padding: 15px; 
            background: rgba(0, 0, 0, 0.8); 
            text-align: center;
            opacity: 1; 
            visibility: visible;
            transition: 0.3s;
            z-index: 1; 
        }
        .gallery-overlay span { 
            color: var(--accent); 
            font-weight: 700; 
            text-transform: uppercase; 
            font-size: 0
